services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: schoolhub
      POSTGRES_USER: schoolhub
      POSTGRES_PASSWORD: schoolhub
    ports:
      - '5432:5432'
    volumes:
      - schoolhub_postgres_data:/var/lib/postgresql/data

volumes:
  schoolhub_postgres_data:
